name: sme-demo

# Published ports bind to 127.0.0.1 on purpose. The demo ships a documented,
# public password (demo / Demo_Passw0rd!) and a fixed OTP, so the services must
# not be reachable from another machine. Containers reach each other over the
# `sme` network and their healthchecks run inside the container, so nothing in
# the stack depends on the host bindings. Override these mappings locally if a
# remote browser or device has to reach a service.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?create .env from .env.example}"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - sme

  # One-shot. Applies db/migrations/api to the API database, then exits.
  # It keeps using sa: the migrator is the schema-owner identity.
  db-migrator:
    build:
      context: .
      dockerfile: tools/Migrator/Dockerfile
    image: sme-demo-migrator:local
    environment:
      DATABASE_URL: "Server=mssql;Database=sme_api;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      MIGRATIONS_PATH: /app/migrations/api
      DB_WAIT_SECONDS: "120"
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"
    networks:
      - sme

  # One-shot. Applies db/migrations/auth to the auth database, then exits.
  # Reuses the generic migrator image with an auth-specific path and DSN.
  db-migrator-auth:
    build:
      context: .
      dockerfile: tools/Migrator/Dockerfile
    image: sme-demo-migrator:local
    environment:
      DATABASE_URL: "Server=mssql;Database=sme_auth;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      MIGRATIONS_PATH: /app/migrations/auth
      DB_WAIT_SECONDS: "120"
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"
    networks:
      - sme

  # One-shot. Creates the two application logins and grants each one only
  # db_datareader + db_datawriter in its own database (requirements §8.8,
  # acceptance 15). No DDL rights are granted. Passwords come from .env via
  # sqlcmd variables, never from an image or this file.
  db-grants:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v SME_API_DB_PASSWORD="$$SME_API_DB_PASSWORD"
        SME_AUTH_DB_PASSWORD="$$SME_AUTH_DB_PASSWORD"
        -i /bootstrap/app-logins.sql
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?create .env from .env.example}"
      SME_API_DB_PASSWORD: "${SME_API_DB_PASSWORD:?set SME_API_DB_PASSWORD in .env}"
      SME_AUTH_DB_PASSWORD: "${SME_AUTH_DB_PASSWORD:?set SME_AUTH_DB_PASSWORD in .env}"
    volumes:
      - ./db/bootstrap:/bootstrap:ro
    depends_on:
      mssql:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      db-migrator-auth:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - sme

  # Table Storage for the transaction feed and Blob Storage for card artwork.
  # Ports stay internal; only the API can reach them.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - "azurite"
      - "--blobHost"
      - "0.0.0.0"
      - "--tableHost"
      - "0.0.0.0"
      - "--queueHost"
      - "0.0.0.0"
      - "--location"
      - "/data"
      # The Azure SDK ships a newer Storage API version than the current
      # Azurite release understands; this flag keeps the emulator usable.
      - "--skipApiVersionCheck"
    volumes:
      - azurite-data:/data
    # Azurite is the one service every other service waits for, and on a cold
    # Docker Desktop it is also one of the slowest to answer: the first start
    # unpacks the image and replays the data volume while SQL Server is still
    # warming up. With a short window it was marked unhealthy, and Compose
    # aborted the whole `up` ("dependency failed to start") before the
    # migrators, api and auth were ever created. Visual Studio then surfaces
    # only "Unable to start debugging" (0x80070057) for the same abort, so the
    # window is deliberately generous: 120s to start plus 30 x 10s of retries.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"const net=require('net');const check=p=>new Promise((resolve,reject)=>{const s=net.connect(p,'127.0.0.1',()=>{s.end();resolve()});s.on('error',reject)});Promise.all([check(10000),check(10002)]).then(()=>process.exit(0)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - sme

  auth:
    build:
      context: .
      dockerfile: src/SmeDemo.Auth/Dockerfile
    image: sme-demo-auth:local
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      DATABASE_URL: "Server=mssql;Database=sme_auth;User Id=sme_auth_app;Password=${SME_AUTH_DB_PASSWORD:?set SME_AUTH_DB_PASSWORD in .env};TrustServerCertificate=True"
      ORG_ID: "${ORG_ID:-sme}"
      DEMO_MODE: "${DEMO_MODE:-true}"
      DEMO_USERNAME: "${DEMO_USERNAME:-demo}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-Demo_Passw0rd!}"
      DEMO_PHONE: "${DEMO_PHONE:-+61400000000}"
      DEMO_OTP: "${DEMO_OTP-123456}"
      JWT_ISSUER: "${JWT_ISSUER:-http://auth:8081}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sme-demo-api}"
      JWT_TTL: "${JWT_TTL:-30m}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      SMS_PROVIDER_URL: "${SMS_PROVIDER_URL:-http://sms-mock:8083}"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - auth-keys:/keys
    depends_on:
      mssql:
        condition: service_healthy
      db-migrator-auth:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      sms-mock:
        # Deliberately not service_healthy: a broken SMS mock must not stop auth
        # from starting; login then returns a readable 503 (acceptance 17).
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:8081/healthz || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sme

  # Stand-in SMS gateway. It validates the { to, text } envelope and logs each
  # message in plaintext; that log is where the demo OTP is read from. There is
  # no persistence and no real delivery (requirements §6.5).
  sms-mock:
    build:
      context: .
      dockerfile: tools/SmsMock/Dockerfile
    image: sme-demo-sms-mock:local
    environment:
      ASPNETCORE_URLS: "http://+:8083"
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:8083/healthz || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sme

  # Stand-in card issuer. The API pulls transactions from here instead of
  # seeding them; the fixture is the demo contract (requirements §13.4).
  issuer-mock:
    build:
      context: .
      dockerfile: tools/IssuerMock/Dockerfile
    image: sme-demo-issuer-mock:local
    environment:
      ASPNETCORE_URLS: "http://+:8084"
      ISSUER_API_KEY: "${ISSUER_API_KEY:-demo-issuer-key}"
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:8084/healthz || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sme

  api:
    build:
      context: .
      dockerfile: src/SmeDemo.Api/Dockerfile
    image: sme-demo-api:local
    environment:
      ASPNETCORE_URLS: "http://+:8082"
      ASPNETCORE_ENVIRONMENT: "Development"
      DATABASE_URL: "Server=mssql;Database=sme_api;User Id=sme_api_app;Password=${SME_API_DB_PASSWORD:?set SME_API_DB_PASSWORD in .env};TrustServerCertificate=True"
      ORG_ID: "${ORG_ID:-sme}"
      JWT_ISSUER: "${JWT_ISSUER:-http://auth:8081}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sme-demo-api}"
      AUTH_METADATA_URL: "http://auth:8081/.well-known/openid-configuration"
      # The demo's auth service is plain HTTP inside the Compose network. This
      # is development-only: the default is true, and only this file turns it
      # off so a metadata fetch to auth:8081 works without TLS.
      AUTH_REQUIRE_HTTPS_METADATA: "false"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      TRANSACTIONS_TABLE: "transactions"
      CARD_ART_CONTAINER: "card-art"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8082}"
      SEED_ENABLED: "${SEED_ENABLED:-true}"
      ISSUER_BASE_URL: "${ISSUER_BASE_URL:-http://issuer-mock:8084}"
      ISSUER_API_KEY: "${ISSUER_API_KEY:-demo-issuer-key}"
      ISSUER_SYNC_INTERVAL: "${ISSUER_SYNC_INTERVAL:-5m}"
      ISSUER_SYNC_ENABLED: "${ISSUER_SYNC_ENABLED:-true}"
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      mssql:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      db-migrator-auth:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      azurite:
        condition: service_healthy
      issuer-mock:
        # Deliberately not service_healthy: the sync worker tolerates an issuer
        # that is down or unhealthy, and the API must still start and serve its
        # local feed in that case (acceptance 11).
        condition: service_started
    healthcheck:
      # Readiness, not liveness: mssql, azurite and auth are healthy before this
      # service starts, so a 200 here means the API can actually serve traffic.
      # The probe itself answers within 5s; allow headroom for a slow first run.
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:8082/readyz || exit 1"
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    networks:
      - sme

  # React SPA built to static assets and served by nginx on 8080. nginx also
  # reverse-proxies /auth and /api so the browser only ever talks to one origin
  # (requirements §9.1). /config.js is generated at container start from the
  # DEMO_* values below.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: sme-demo-web:local
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      DEMO_USERNAME: "${DEMO_USERNAME:-demo}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-Demo_Passw0rd!}"
      DEMO_OTP: "${DEMO_OTP-123456}"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      auth:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sme

networks:
  sme:
    driver: bridge

volumes:
  mssql-data:
  auth-keys:
  azurite-data:
