# Azure Pipelines equivalent of .github/workflows/ci.yml.
#
# The Build stage is the same set of gates as the GitHub Actions workflow:
# .NET build/tests, formatting, OpenAPI artefact, migrations/SQL, removed-package
# guard, vulnerability scan, secret scan, web build/tests, Compose validation,
# container image builds, and the Compose smoke test.
#
# The Test/UAT/Production deployment stages are implemented by
# tools/deploy/deploy.sh against infra/main.bicep. They are skipped by default
# because a run needs an Azure subscription prepared once by hand. Set both
# queue-time parameters after that preparation:
#
#   publishImages     - push the six images to Azure Container Registry, resolve
#                       their digests, and scan the promoted digests
#   enableDeployments - run the Test/UAT/Prod stages
#
# A release run sets BOTH parameters to true. It walks Test -> UAT -> Prod,
# deploying the same image digests throughout. UAT and Prod have no queue-time
# trigger of their own: their manual gate is the Azure DevOps Environment
# approval/check, which pauses the run at that stage until an approver acts.
#
# Secrets are never written in this file. sqlAdminPassword,
# SME_API_DB_PASSWORD, SME_AUTH_DB_PASSWORD, and ISSUER_API_KEY must come from
# the per-environment variable group (optionally Key Vault-backed), by
# convention grouped in vg-sme-demo-test, vg-sme-demo-uat, and vg-sme-demo-prod.
# The demo credentials below are published by design; replace them and set
# demoMode=false for any non-demo deployment.
#
# The one-time Azure setup is in docs/azure-pipelines.md. The decision record is
# docs/reference/adr/ADR-020-azure-hosting-and-test-deployment.md.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: publishImages
    displayName: Push images to Azure Container Registry
    type: boolean
    default: false
  - name: enableDeployments
    displayName: Enable Test/UAT/Prod deployment stages
    type: boolean
    default: false

variables:
  # Keep in step with global.json; the GitHub workflow reads that file directly.
  dotnetVersion: "10.0.404"
  nodeVersion: "22.x"
  trivyVersion: "0.76.2"
  trivySha256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  # One tag per build. Tags are for humans; the resolved digest is the
  # immutable promotion contract. $(Build.BuildId) is also pushed for
  # readability in ACR.
  imageTag: $(Build.SourceVersion)

  # Resource-name prefix. infra/main.bicep caps this at 10 characters because
  # Container App and job names must stay within 32 characters.
  namePrefix: smedemo

  # Registry identity. acrName is the registry *name* used by the az CLI
  # (az acr ...); the login server for image references comes from the
  # image-digests artefact, so there is no separate variable to get out of step.
  acrName: ""
  # Docker registry service connection used by Docker@2 to push.
  acrServiceConnection: ""
  # Azure Resource Manager service connection used by AzureCLI@2 and the
  # deployment stages. Must be authorised to deploy to every target group.
  azureServiceConnection: ""

  location: "australiaeast"
  sqlAdminLogin: "smeadmin"

  # Default target resource groups. A per-environment variable group may
  # override its own group's value; the registry must live in the target group
  # because the single-file template creates the AcrPull role assignment there.
  testResourceGroup: "rg-sme-demo-test"
  uatResourceGroup: "rg-sme-demo-uat"
  prodResourceGroup: "rg-sme-demo-prod"

  # Published demo values (not secrets). deploy.sh requires all of them, and
  # infra/main.bicep marks DEMO_MODE, DEMO_USERNAME, DEMO_PASSWORD, and DEMO_OTP
  # as plain parameters on purpose. Replace them before a non-demo deployment.
  orgId: "sme"
  demoMode: "true"
  demoUsername: "demo"
  demoPassword: "Demo_Passw0rd!"
  demoOtp: "123456"

  # Secret variables, deliberately not defined here: sqlAdminPassword,
  # SME_API_DB_PASSWORD, SME_AUTH_DB_PASSWORD, and ISSUER_API_KEY come from the
  # per-environment variable group (vg-sme-demo-<env>), optionally linked to
  # Key Vault. Adding them to this file would commit a secret.

stages:
  - stage: Build
    displayName: Build and verify
    jobs:
      - job: DotNet
        displayName: .NET build, tests and gates
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 30
        steps:
          # Full history so the secret scan covers every commit, not only the
          # working tree. The other jobs keep the shallow default.
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Set up .NET
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: dotnet tool restore
            displayName: Restore local tools

          - script: dotnet build SmeDemo.slnx --configuration Release
            displayName: Build

          - script: >-
              dotnet test SmeDemo.slnx --configuration Release --no-build
              --logger trx
              --results-directory "$(Agent.TempDirectory)/TestResults"
            displayName: Test

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "$(Agent.TempDirectory)/TestResults/*.trx"
              failTaskOnFailedTests: true

          - script: dotnet format SmeDemo.slnx --verify-no-changes
            displayName: Verify formatting

          # The Release build runs the API project's build-time OpenAPI
          # generator, which rewrites openapi/v1.json. A committed document must
          # not be stale.
          - bash: |
              set -euo pipefail
              test -f openapi/v1.json
              if ! git diff --exit-code -- openapi/; then
                echo "##vso[task.logissue type=error]openapi/v1.json is stale. Rebuild with 'dotnet build src/SmeDemo.Api/SmeDemo.Api.csproj --configuration Release' and commit the regenerated file."
                exit 1
              fi
            displayName: Verify the generated OpenAPI document is committed

          - script: >-
              dotnet tool run dotnet-ef migrations has-pending-model-changes
              --project src/SmeDemo.Infrastructure
              --startup-project src/SmeDemo.Infrastructure
              --configuration Release --no-build
            displayName: Check the API model for pending migrations

          - script: >-
              dotnet tool run dotnet-ef migrations has-pending-model-changes
              --project src/SmeDemo.Auth
              --startup-project src/SmeDemo.Auth
              --configuration Release --no-build
            displayName: Check the auth model for pending migrations

          - bash: |
              set -euo pipefail
              dotnet tool run dotnet-ef migrations script --idempotent \
                --project src/SmeDemo.Infrastructure \
                --startup-project src/SmeDemo.Infrastructure \
                --configuration Release --no-build \
                --output "$(Agent.TempDirectory)/sme_api.sql"
              diff -u db/migrations/api/sme_api.sql "$(Agent.TempDirectory)/sme_api.sql"

              dotnet tool run dotnet-ef migrations script --idempotent \
                --project src/SmeDemo.Auth \
                --startup-project src/SmeDemo.Auth \
                --configuration Release --no-build \
                --output "$(Agent.TempDirectory)/sme_auth.sql"
              diff -u db/migrations/auth/sme_auth.sql "$(Agent.TempDirectory)/sme_auth.sql"
            displayName: Check generated SQL matches the model

          - bash: |
              set -euo pipefail
              if grep -rE '<Package(Reference|Version) Include="(MediatR|AutoMapper)"' \
                  --include='*.csproj' --include='*.props' .; then
                echo "##vso[task.logissue type=error]MediatR/AutoMapper must not be reintroduced; see docs/licensing.md §3."
                exit 1
              fi
            displayName: Check removed packages stay removed

          - script: python3 tools/smoke/check-vulnerabilities.py
            displayName: Scan dependencies for known vulnerabilities

          # Pinned and checksum-verified. The checkout above fetches full
          # history, so gitleaks scans every commit, not only the working tree.
          - bash: |
              set -euo pipefail
              archive="$(Agent.TempDirectory)/gitleaks.tar.gz"
              curl -fsSL --retry 3 -o "$archive" \
                "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
              echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
                | sha256sum --check --strict
              tar -xzf "$archive" -C "$(Agent.TempDirectory)" gitleaks
              "$(Agent.TempDirectory)/gitleaks" detect --source . --redact \
                --config .gitleaks.toml --exit-code 1
            displayName: Scan for secrets

      - job: Web
        displayName: Web build and tests
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 15
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Set up Node
            inputs:
              version: $(nodeVersion)

          - script: npm ci
            displayName: Install
            workingDirectory: web

          - script: npm run build
            displayName: Type-check and build
            workingDirectory: web

          - script: npm test
            displayName: Test
            workingDirectory: web

      - job: ComposeValidation
        displayName: Compose validation
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 10
        steps:
          - checkout: self

          - script: cp .env.example .env
            displayName: Prepare compose environment

          - script: docker compose config -q
            displayName: Validate compose file

          # The deployment assets are statically validated on every build, so a
          # broken template or script fails in the Build stage rather than in
          # the first deployment. This job is deliberately still one job: its
          # display name is one of the five contractual checks.
          - bash: |
              set -euo pipefail
              az bicep install
              az bicep build --file infra/main.bicep --stdout > /dev/null
            displayName: Validate Bicep template

          - bash: |
              set -euo pipefail
              shopt -s nullglob
              scripts=(tools/deploy/*.sh web/nginx/*.sh)
              [ "${#scripts[@]}" -gt 0 ] || { echo "No deployment shell scripts found" >&2; exit 1; }
              for script in "${scripts[@]}"; do
                bash -n "$script"
                echo "OK: $script"
              done
            displayName: Check deployment shell script syntax

      - job: Images
        displayName: Build container images
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 45
        steps:
          - checkout: self

          # Pinned and checksum-verified, matching the GitHub workflow. Installed
          # in both modes: the local build scans the local tags, and the publish
          # path scans the promoted digests.
          - bash: |
              set -euo pipefail
              archive="$(Agent.TempDirectory)/trivy.tar.gz"
              curl -fsSL --retry 3 -o "$archive" \
                "https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)/trivy_$(trivyVersion)_Linux-64bit.tar.gz"
              echo "$(trivySha256)  ${archive}" | sha256sum --check --strict
              tar -xzf "$archive" -C "$(Agent.TempDirectory)" trivy
            displayName: Install Trivy

          # With publishImages=true the images are pushed to ACR, the tag is
          # resolved to six immutable digests, and those digests are scanned.
          # Test/UAT/Prod consume the published image-digests artefact and never
          # rebuild.
          - ${{ if eq(parameters.publishImages, true) }}:
              - task: Docker@2
                displayName: Build and push api
                inputs:
                  command: buildAndPush
                  containerRegistry: $(acrServiceConnection)
                  repository: sme-demo/api
                  Dockerfile: src/SmeDemo.Api/Dockerfile
                  buildContext: .
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)

              - task: Docker@2
                displayName: Build and push auth
                inputs:
                  command: buildAndPush
                  containerRegistry: $(acrServiceConnection)
                  repository: sme-demo/auth
                  Dockerfile: src/SmeDemo.Auth/Dockerfile
                  buildContext: .
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)

              - task: Docker@2
                displayName: Build and push web
                inputs:
                  command: buildAndPush
                  containerRegistry: $(acrServiceConnection)
                  repository: sme-demo/web
                  Dockerfile: web/Dockerfile
                  buildContext: .
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)

              - task: Docker@2
                displayName: Build and push sms-mock
                inputs:
                  command: buildAndPush
                  containerRegistry: $(acrServiceConnection)
                  repository: sme-demo/sms-mock
                  Dockerfile: tools/SmsMock/Dockerfile
                  buildContext: .
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)

              - task: Docker@2
                displayName: Build and push issuer-mock
                inputs:
                  command: buildAndPush
                  containerRegistry: $(acrServiceConnection)
                  repository: sme-demo/issuer-mock
                  Dockerfile: tools/IssuerMock/Dockerfile
                  buildContext: .
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)

              - task: Docker@2
                displayName: Build and push migrator
                inputs:
                  command: buildAndPush
                  containerRegistry: $(acrServiceConnection)
                  repository: sme-demo/migrator
                  Dockerfile: tools/Migrator/Dockerfile
                  buildContext: .
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)

              # Resolve the just-pushed tag to one immutable digest per image.
              # The JSON is the deployment contract for every environment.
              - task: AzureCLI@2
                displayName: Resolve image digests
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  inlineScript: |
                    set -euo pipefail
                    cd "$(Build.SourcesDirectory)"
                    az acr login --name "$(acrName)"
                    bash tools/deploy/resolve-digests.sh \
                      --acr "$(acrName)" \
                      --tag "$(imageTag)" \
                      --output "$(Build.ArtifactStagingDirectory)/image-digests/images.json"

              - task: PublishPipelineArtifact@1
                displayName: Publish image digests
                inputs:
                  targetPath: "$(Build.ArtifactStagingDirectory)/image-digests"
                  artifact: image-digests

              # SBOMs are build artefacts: generate them before the gate so a
              # failing scan still leaves the inventory behind. The reference is
              # the digest, not the tag, so the SBOM describes exactly what is
              # promoted. az acr login above left the docker credential in place.
              - bash: |
                  set -euo pipefail
                  images_json="$(Build.ArtifactStagingDirectory)/image-digests/images.json"
                  mkdir -p "$(Agent.TempDirectory)/sbom"
                  for image in api auth web sms-mock issuer-mock migrator; do
                    reference="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["images"][sys.argv[2]])' "$images_json" "$image")"
                    "$(Agent.TempDirectory)/trivy" image \
                      --scanners vuln --timeout 15m \
                      --format cyclonedx \
                      --output "$(Agent.TempDirectory)/sbom/sme-demo-${image}.cdx.json" \
                      "$reference"
                  done
                displayName: Generate CycloneDX SBOMs from promoted digests

              - task: PublishPipelineArtifact@1
                displayName: Publish SBOMs
                inputs:
                  targetPath: "$(Agent.TempDirectory)/sbom"
                  artifact: sboms

              # Same gate and flags as the local path, applied registry-side to
              # the promoted digest. A fixable HIGH/CRITICAL finding fails here,
              # before any environment can consume the digest.
              - bash: |
                  set -euo pipefail
                  images_json="$(Build.ArtifactStagingDirectory)/image-digests/images.json"
                  for image in api auth web sms-mock issuer-mock migrator; do
                    reference="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["images"][sys.argv[2]])' "$images_json" "$image")"
                    "$(Agent.TempDirectory)/trivy" image \
                      --scanners vuln --timeout 15m \
                      --severity HIGH,CRITICAL \
                      --ignore-unfixed \
                      --exit-code 1 \
                      "$reference"
                  done
                displayName: Scan promoted digests for vulnerabilities

          - ${{ else }}:
              - bash: |
                  set -euo pipefail
                  docker build --file src/SmeDemo.Api/Dockerfile \
                    --tag "sme-demo-api:$(imageTag)" .
                  docker build --file src/SmeDemo.Auth/Dockerfile \
                    --tag "sme-demo-auth:$(imageTag)" .
                  docker build --file web/Dockerfile \
                    --tag "sme-demo-web:$(imageTag)" .
                  docker build --file tools/SmsMock/Dockerfile \
                    --tag "sme-demo-sms-mock:$(imageTag)" .
                  docker build --file tools/IssuerMock/Dockerfile \
                    --tag "sme-demo-issuer-mock:$(imageTag)" .
                  docker build --file tools/Migrator/Dockerfile \
                    --tag "sme-demo-migrator:$(imageTag)" .
                displayName: Build local images

              - bash: |
                  set -euo pipefail
                  mkdir -p "$(Agent.TempDirectory)/sbom"
                  for image in api auth web sms-mock issuer-mock migrator; do
                    "$(Agent.TempDirectory)/trivy" image \
                      --scanners vuln --timeout 15m \
                      --format cyclonedx \
                      --output "$(Agent.TempDirectory)/sbom/sme-demo-${image}.cdx.json" \
                      "sme-demo-${image}:$(imageTag)"
                  done
                displayName: Generate CycloneDX SBOMs

              - task: PublishPipelineArtifact@1
                displayName: Publish SBOMs
                inputs:
                  targetPath: "$(Agent.TempDirectory)/sbom"
                  artifact: sboms

              - bash: |
                  set -euo pipefail
                  for image in api auth web sms-mock issuer-mock migrator; do
                    "$(Agent.TempDirectory)/trivy" image \
                      --scanners vuln --timeout 15m \
                      --severity HIGH,CRITICAL \
                      --ignore-unfixed \
                      --exit-code 1 \
                      "sme-demo-${image}:$(imageTag)"
                  done
                displayName: Scan images for vulnerabilities

      - job: ComposeSmoke
        displayName: Compose smoke test
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 45
        steps:
          - checkout: self

          - script: cp .env.example .env
            displayName: Prepare compose environment

          - script: >-
              docker compose up -d --build
              mssql azurite db-migrator db-migrator-auth db-grants auth api
            displayName: Start the stack

          - bash: |
              set -euo pipefail

              wait_for_health() {
                local service="$1"
                local status=""
                for _ in $(seq 1 90); do
                  status="$(docker inspect --format \
                    '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                    "$(docker compose ps -q "$service")" 2>/dev/null || true)"
                  if [ "$status" = "healthy" ]; then
                    echo "$service is healthy"
                    return 0
                  fi
                  sleep 2
                done
                echo "##vso[task.logissue type=error]$service did not become healthy (last status: ${status:-unknown})"
                return 1
              }

              wait_for_exit() {
                local service="$1"
                local status=""
                for _ in $(seq 1 90); do
                  status="$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' \
                    "$(docker compose ps -aq "$service")" 2>/dev/null || true)"
                  if [ "$status" = "exited:0" ]; then
                    echo "$service exited 0"
                    return 0
                  fi
                  sleep 2
                done
                echo "##vso[task.logissue type=error]$service did not exit 0 (last status: ${status:-unknown})"
                return 1
              }

              wait_for_health auth
              wait_for_health api
              wait_for_exit db-migrator
              wait_for_exit db-migrator-auth
              wait_for_exit db-grants
            displayName: Wait for migrations and health

          - script: bash tools/smoke/compose-smoke.sh
            displayName: Run the compose smoke test

          # Diagnose before the teardown step removes the containers.
          - bash: |
              docker compose ps -a
              docker compose logs --no-color
            displayName: Dump compose state on failure
            condition: failed()

          - script: docker compose down -v --remove-orphans
            displayName: Tear down
            condition: always()

  # The deployment stages are included only when the queue-time parameter is
  # true. Compile-time inclusion avoids relying on runtime boolean-parameter
  # rendering in condition expressions.
  #
  # Each deploy job downloads the image-digests artefact produced by this same
  # run, binds its environment's variable group, and calls deploy.sh. No stage
  # rebuilds an image. The Test environment has no approval; UAT and Prod pause
  # on their Environment approval/check, which is their only manual gate.
  - ${{ if eq(parameters.enableDeployments, true) }}:
    - stage: DeployTest
      displayName: Deploy Test
      dependsOn: Build
      # Test deploys automatically, but only for a main build: a pull-request
      # run must never reach an environment even if enableDeployments is set.
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - deployment: DeployTest
          displayName: Deploy to Test
          environment: sme-demo-test
          pool:
            vmImage: ubuntu-latest
          timeoutInMinutes: 60
          variables:
            - group: vg-sme-demo-test
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  # Artifact published by the Images job. A release run must
                  # also set publishImages=true, or there is nothing to deploy.
                  - task: DownloadPipelineArtifact@2
                    displayName: Download image digests
                    inputs:
                      buildType: current
                      artifactName: image-digests
                      targetPath: "$(Pipeline.Workspace)/image-digests"

                  - task: AzureCLI@2
                    displayName: Deploy to Test
                    inputs:
                      azureSubscription: $(azureServiceConnection)
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        set -euo pipefail
                        bash tools/deploy/deploy.sh
                    env:
                      ENVIRONMENT_NAME: test
                      RESOURCE_GROUP: $(testResourceGroup)
                      LOCATION: $(location)
                      ACR_NAME: $(acrName)
                      NAME_PREFIX: $(namePrefix)
                      IMAGES_JSON: $(Pipeline.Workspace)/image-digests/images.json
                      SOURCE_COMMIT: $(Build.SourceVersion)
                      DEPLOYMENT_RECORD_FILE: $(Build.ArtifactStagingDirectory)/deployment-record.json
                      SQL_ADMIN_LOGIN: $(sqlAdminLogin)
                      SQL_ADMIN_PASSWORD: $(sqlAdminPassword)
                      SME_API_DB_PASSWORD: $(SME_API_DB_PASSWORD)
                      SME_AUTH_DB_PASSWORD: $(SME_AUTH_DB_PASSWORD)
                      ISSUER_API_KEY: $(ISSUER_API_KEY)
                      ORG_ID: $(orgId)
                      DEMO_MODE: $(demoMode)
                      DEMO_USERNAME: $(demoUsername)
                      DEMO_PASSWORD: $(demoPassword)
                      DEMO_OTP: $(demoOtp)

                  # A failed deployment may stop before deploy.sh writes the
                  # record. Write a minimal failure record so the artifact
                  # still captures what happened, instead of failing the
                  # publish task for a missing file.
                  - bash: |
                      set -euo pipefail
                      record="$(Build.ArtifactStagingDirectory)/deployment-record.json"
                      if [ ! -f "$record" ]; then
                        printf '{"environment":"test","status":"failed","note":"the deployment did not reach the record step"}\n' > "$record"
                      fi
                    displayName: Ensure deployment record exists
                    condition: succeededOrFailed()

                  - task: PublishPipelineArtifact@1
                    displayName: Publish deployment record
                    condition: succeededOrFailed()
                    inputs:
                      targetPath: "$(Build.ArtifactStagingDirectory)/deployment-record.json"
                      artifact: deployment-record-test

  - ${{ if eq(parameters.enableDeployments, true) }}:
    - stage: DeployUat
      displayName: Deploy UAT
      dependsOn: DeployTest
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - deployment: DeployUat
          displayName: Deploy to UAT
          # Approval/check on this Environment is the manual gate. There is no
          # separate queue-time trigger for UAT.
          environment: sme-demo-uat
          pool:
            vmImage: ubuntu-latest
          timeoutInMinutes: 60
          variables:
            - group: vg-sme-demo-uat
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  - task: DownloadPipelineArtifact@2
                    displayName: Download image digests
                    inputs:
                      buildType: current
                      artifactName: image-digests
                      targetPath: "$(Pipeline.Workspace)/image-digests"

                  - task: AzureCLI@2
                    displayName: Deploy to UAT
                    inputs:
                      azureSubscription: $(azureServiceConnection)
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        set -euo pipefail
                        bash tools/deploy/deploy.sh
                    env:
                      ENVIRONMENT_NAME: uat
                      RESOURCE_GROUP: $(uatResourceGroup)
                      LOCATION: $(location)
                      ACR_NAME: $(acrName)
                      NAME_PREFIX: $(namePrefix)
                      IMAGES_JSON: $(Pipeline.Workspace)/image-digests/images.json
                      SOURCE_COMMIT: $(Build.SourceVersion)
                      DEPLOYMENT_RECORD_FILE: $(Build.ArtifactStagingDirectory)/deployment-record.json
                      SQL_ADMIN_LOGIN: $(sqlAdminLogin)
                      SQL_ADMIN_PASSWORD: $(sqlAdminPassword)
                      SME_API_DB_PASSWORD: $(SME_API_DB_PASSWORD)
                      SME_AUTH_DB_PASSWORD: $(SME_AUTH_DB_PASSWORD)
                      ISSUER_API_KEY: $(ISSUER_API_KEY)
                      ORG_ID: $(orgId)
                      DEMO_MODE: $(demoMode)
                      DEMO_USERNAME: $(demoUsername)
                      DEMO_PASSWORD: $(demoPassword)
                      DEMO_OTP: $(demoOtp)

                  - bash: |
                      set -euo pipefail
                      record="$(Build.ArtifactStagingDirectory)/deployment-record.json"
                      if [ ! -f "$record" ]; then
                        printf '{"environment":"uat","status":"failed","note":"the deployment did not reach the record step"}\n' > "$record"
                      fi
                    displayName: Ensure deployment record exists
                    condition: succeededOrFailed()

                  - task: PublishPipelineArtifact@1
                    displayName: Publish deployment record
                    condition: succeededOrFailed()
                    inputs:
                      targetPath: "$(Build.ArtifactStagingDirectory)/deployment-record.json"
                      artifact: deployment-record-uat

  - ${{ if eq(parameters.enableDeployments, true) }}:
    - stage: DeployProd
      displayName: Deploy Production
      dependsOn: DeployUat
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
        - deployment: DeployProd
          displayName: Deploy to Production
          # Approval/check on this Environment, plus the business change
          # ticket recorded in the run, is the manual gate. There is no
          # separate queue-time trigger for Production.
          environment: sme-demo-prod
          pool:
            vmImage: ubuntu-latest
          timeoutInMinutes: 60
          variables:
            - group: vg-sme-demo-prod
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  - task: DownloadPipelineArtifact@2
                    displayName: Download image digests
                    inputs:
                      buildType: current
                      artifactName: image-digests
                      targetPath: "$(Pipeline.Workspace)/image-digests"

                  - task: AzureCLI@2
                    displayName: Deploy to Production
                    inputs:
                      azureSubscription: $(azureServiceConnection)
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        set -euo pipefail
                        bash tools/deploy/deploy.sh
                    env:
                      ENVIRONMENT_NAME: prod
                      RESOURCE_GROUP: $(prodResourceGroup)
                      LOCATION: $(location)
                      ACR_NAME: $(acrName)
                      NAME_PREFIX: $(namePrefix)
                      IMAGES_JSON: $(Pipeline.Workspace)/image-digests/images.json
                      SOURCE_COMMIT: $(Build.SourceVersion)
                      DEPLOYMENT_RECORD_FILE: $(Build.ArtifactStagingDirectory)/deployment-record.json
                      SQL_ADMIN_LOGIN: $(sqlAdminLogin)
                      SQL_ADMIN_PASSWORD: $(sqlAdminPassword)
                      SME_API_DB_PASSWORD: $(SME_API_DB_PASSWORD)
                      SME_AUTH_DB_PASSWORD: $(SME_AUTH_DB_PASSWORD)
                      ISSUER_API_KEY: $(ISSUER_API_KEY)
                      ORG_ID: $(orgId)
                      DEMO_MODE: $(demoMode)
                      DEMO_USERNAME: $(demoUsername)
                      DEMO_PASSWORD: $(demoPassword)
                      DEMO_OTP: $(demoOtp)

                  - bash: |
                      set -euo pipefail
                      record="$(Build.ArtifactStagingDirectory)/deployment-record.json"
                      if [ ! -f "$record" ]; then
                        printf '{"environment":"prod","status":"failed","note":"the deployment did not reach the record step"}\n' > "$record"
                      fi
                    displayName: Ensure deployment record exists
                    condition: succeededOrFailed()

                  - task: PublishPipelineArtifact@1
                    displayName: Publish deployment record
                    condition: succeededOrFailed()
                    inputs:
                      targetPath: "$(Build.ArtifactStagingDirectory)/deployment-record.json"
                      artifact: deployment-record-prod
