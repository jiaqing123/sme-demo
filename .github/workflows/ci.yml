name: CI

# Every push to main and every pull request builds and tests both halves of the
# repository. The jobs are self-contained: the .NET tests use InMemory EF,
# WebApplicationFactory fakes, and unused connection strings, and the frontend
# tests run in jsdom, so no MSSQL/Azurite/SMS containers are needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build SmeDemo.slnx --configuration Release

      - name: Test
        run: dotnet test SmeDemo.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format SmeDemo.slnx --verify-no-changes

      # The Release build above runs the API project's build-time OpenAPI
      # generator (Microsoft.Extensions.ApiDescription.Server), which rewrites
      # openapi/v1.json. The file is committed, so a stale document must fail
      # here rather than reach the published contract.
      - name: Verify the generated OpenAPI document is committed
        run: |
          test -f openapi/v1.json
          if ! git diff --exit-code -- openapi/; then
            echo "::error::openapi/v1.json is stale. Rebuild with " \
              "'dotnet build src/SmeDemo.Api/SmeDemo.Api.csproj --configuration Release' " \
              "and commit the regenerated file."
            exit 1
          fi

      # The generated idempotent SQL is committed, so a model change without a
      # migration must fail here rather than after deployment (requirements §8.8).
      - name: Check the API model for pending migrations
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/SmeDemo.Infrastructure
          --startup-project src/SmeDemo.Infrastructure
          --configuration Release --no-build

      - name: Check the auth model for pending migrations
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/SmeDemo.Auth
          --startup-project src/SmeDemo.Auth
          --configuration Release --no-build

      # The committed scripts are the deployable artefact; regenerate them and
      # fail on any difference so a hand-edited or stale file cannot ship.
      - name: Check generated SQL matches the model
        run: |
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/SmeDemo.Infrastructure \
            --startup-project src/SmeDemo.Infrastructure \
            --configuration Release --no-build \
            --output "$RUNNER_TEMP/sme_api.sql"
          diff -u db/migrations/api/sme_api.sql "$RUNNER_TEMP/sme_api.sql"

          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/SmeDemo.Auth \
            --startup-project src/SmeDemo.Auth \
            --configuration Release --no-build \
            --output "$RUNNER_TEMP/sme_auth.sql"
          diff -u db/migrations/auth/sme_auth.sql "$RUNNER_TEMP/sme_auth.sql"

      # MediatR and AutoMapper were removed by decision (docs/licensing.md §3).
      # Fail if either is reintroduced in a project or in central package
      # management without revisiting that decision.
      - name: Check removed packages stay removed
        run: |
          if grep -rE '<Package(Reference|Version) Include="(MediatR|AutoMapper)"' \
              --include='*.csproj' --include='*.props' .; then
            echo "MediatR/AutoMapper must not be reintroduced; see docs/licensing.md §3." >&2
            exit 1
          fi

      # `dotnet list package --vulnerable` exits 0 even when it reports
      # findings, so the wrapper parses the JSON form and fails on any entry.
      # Every project under src/, tests/, and tools/ is scanned, transitively.
      - name: Scan dependencies for known vulnerabilities
        run: python3 tools/smoke/check-vulnerabilities.py

      # The scanner binary is pinned and checksum-verified; `--no-git` scans the
      # working tree because actions/checkout fetches a shallow history.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact \
            --config .gitleaks.toml --exit-code 1

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The lock file pins the Linux native binaries (Tailwind oxide, Rollup,
      # lightningcss), so this is the same dependency set the image builds with.
      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Build context is the repository root for every image; the shared
      # Directory.Build.props/Directory.Packages.props and the web lock file are
      # copied by the Dockerfiles themselves.
      - name: Build images
        run: |
          set -euo pipefail
          docker build --file src/SmeDemo.Api/Dockerfile \
            --tag "sme-demo-api:${GITHUB_SHA}" .
          docker build --file src/SmeDemo.Auth/Dockerfile \
            --tag "sme-demo-auth:${GITHUB_SHA}" .
          docker build --file web/Dockerfile \
            --tag "sme-demo-web:${GITHUB_SHA}" .
          docker build --file tools/SmsMock/Dockerfile \
            --tag "sme-demo-sms-mock:${GITHUB_SHA}" .
          docker build --file tools/IssuerMock/Dockerfile \
            --tag "sme-demo-issuer-mock:${GITHUB_SHA}" .
          docker build --file tools/Migrator/Dockerfile \
            --tag "sme-demo-migrator:${GITHUB_SHA}" .

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare compose environment
        run: cp .env.example .env

      # The minimal set. Compose starts their dependencies too, including the
      # sms-mock and issuer-mock services that auth/api talk to.
      - name: Start the stack
        run: >-
          docker compose up -d --build
          mssql azurite db-migrator db-migrator-auth db-grants auth api

      - name: Wait for migrations and health
        run: |
          set -euo pipefail

          wait_for_health() {
            local service="$1"
            local status=""
            for _ in $(seq 1 90); do
              status="$(docker inspect --format \
                '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$(docker compose ps -q "$service")" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                return 0
              fi
              sleep 2
            done
            echo "::error::$service did not become healthy (last status: ${status:-unknown})"
            return 1
          }

          wait_for_exit() {
            local service="$1"
            local status=""
            for _ in $(seq 1 90); do
              status="$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' \
                "$(docker compose ps -aq "$service")" 2>/dev/null || true)"
              if [ "$status" = "exited:0" ]; then
                echo "$service exited 0"
                return 0
              fi
              sleep 2
            done
            echo "::error::$service did not exit 0 (last status: ${status:-unknown})"
            return 1
          }

          wait_for_health auth
          wait_for_health api
          wait_for_exit db-migrator
          wait_for_exit db-migrator-auth
          wait_for_exit db-grants

      - name: Run the compose smoke test
        run: bash tools/smoke/compose-smoke.sh

      # Diagnose before the teardown step removes the containers.
      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
