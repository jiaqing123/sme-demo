name: CI

# Every push to main and every pull request builds and tests both halves of the
# repository. The jobs are self-contained: the .NET tests use InMemory EF,
# WebApplicationFactory fakes, and unused connection strings, and the frontend
# tests run in jsdom, so no MSSQL/Azurite/SMS containers are needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build SmeDemo.slnx --configuration Release

      - name: Test
        run: dotnet test SmeDemo.slnx --configuration Release --no-build

      # The generated idempotent SQL is committed, so a model change without a
      # migration must fail here rather than after deployment (requirements §8.8).
      - name: Check the API model for pending migrations
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/SmeDemo.Infrastructure
          --startup-project src/SmeDemo.Infrastructure
          --configuration Release --no-build

      - name: Check the auth model for pending migrations
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/SmeDemo.Auth
          --startup-project src/SmeDemo.Auth
          --configuration Release --no-build

      # The committed scripts are the deployable artefact; regenerate them and
      # fail on any difference so a hand-edited or stale file cannot ship.
      - name: Check generated SQL matches the model
        run: |
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/SmeDemo.Infrastructure \
            --startup-project src/SmeDemo.Infrastructure \
            --configuration Release --no-build \
            --output "$RUNNER_TEMP/sme_api.sql"
          diff -u db/migrations/api/sme_api.sql "$RUNNER_TEMP/sme_api.sql"

          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/SmeDemo.Auth \
            --startup-project src/SmeDemo.Auth \
            --configuration Release --no-build \
            --output "$RUNNER_TEMP/sme_auth.sql"
          diff -u db/migrations/auth/sme_auth.sql "$RUNNER_TEMP/sme_auth.sql"

      # MediatR and AutoMapper were removed by decision (docs/licensing.md §3).
      # Fail if either is reintroduced in a project or in central package
      # management without revisiting that decision.
      - name: Check removed packages stay removed
        run: |
          if grep -rE '<Package(Reference|Version) Include="(MediatR|AutoMapper)"' \
              --include='*.csproj' --include='*.props' .; then
            echo "MediatR/AutoMapper must not be reintroduced; see docs/licensing.md §3." >&2
            exit 1
          fi

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The lock file pins the Linux native binaries (Tailwind oxide, Rollup,
      # lightningcss), so this is the same dependency set the image builds with.
      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q
