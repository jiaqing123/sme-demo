version: 2

# Dependency updates are grouped so a patch wave produces one pull request per
# ecosystem instead of one per package. The NuGet entry understands central
# package management (Directory.Packages.props).
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
          - "OpenTelemetry*"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"

  # Every image is pinned by digest in the Dockerfiles and docker-compose.yml.
  # Dependabot moves the tag and the digest together; a digest-only change is
  # how a rebuilt base image (for example a patched aspnet:10.0) arrives.
  #
  # Major runtime jumps (dotnet 10 -> 11, node 22 -> 25, nginx 1.x -> 2.x) are
  # not dependency bumps: they change the target framework, the Node runtime the
  # lock file was built for, or the nginx configuration contract. They are
  # handled as explicit work items with the full build, scan and smoke gates, so
  # they are ignored here. Patch and digest updates inside the current major
  # still arrive weekly.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      compose-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/src/SmeDemo.Api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      api-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/src/SmeDemo.Auth"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      auth-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      web-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/tools/IssuerMock"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      issuer-mock-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/tools/SmsMock"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      sms-mock-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/tools/Migrator"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      migrator-images:
        patterns:
          - "*"

  # Actions major upgrades are reviewed like code changes: the pull request
  # itself runs the updated workflow, so a broken major fails before it lands.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
