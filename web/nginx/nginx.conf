# Main nginx configuration for the unprivileged web container.
#
# The image runs as the `nginx` user, so the pid file and every temporary
# directory live on the writable /tmp tmpfs. The stock nginx.conf would write
# /var/run/nginx.pid and use /var/cache/nginx, both of which are read-only in
# the hardened Compose stack.
worker_processes auto;

pid /tmp/nginx.pid;

# Log to the container's stdout/stderr so `docker compose logs` sees them.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # Request-body and header limits are enforced here as well as in Kestrel
    # (MAX_REQUEST_BODY_BYTES, 1 MiB by default) so the edge rejects oversized
    # requests before a connection to the API is opened.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The server block is rendered at container start by
    # /docker-entrypoint.d/30-upstream-config.sh into /tmp/conf.d because the
    # proxy upstreams and DNS resolver differ between Docker Compose and the
    # Azure Container Apps deployment. /etc/nginx/conf.d is intentionally not
    # included: the image ships no fixed server block there.
    include /tmp/conf.d/*.conf;
}
