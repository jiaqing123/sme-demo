server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without a resolver, nginx resolves upstream names
    # once at start-up and keeps the stale IP after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The browser only talks to this origin. Both APIs are proxied with their
    # original paths, so /auth/* -> auth:8081/auth/* and /api/* -> api:8082/api/*.
    location /auth/ {
        set $auth_upstream http://auth:8081;
        proxy_pass $auth_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream http://api:8082;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime configuration is regenerated on every container start.
    location = /config.js {
        add_header Cache-Control "no-store";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints every asset under /assets, so they are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes must all return the shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
