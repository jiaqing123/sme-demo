server {
    # The runtime image is the unprivileged nginx variant, so it listens on an
    # unprivileged port. Compose publishes it as 127.0.0.1:8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Without a resolver, nginx resolves upstream names
    # once at start-up and keeps the stale IP after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The browser only talks to this origin. Both APIs are proxied with their
    # original paths, so /auth/* -> auth:8081/auth/* and /api/* -> api:8082/api/*.
    location /auth/ {
        set $auth_upstream http://auth:8081;
        proxy_pass $auth_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream http://api:8082;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime configuration is regenerated on every container start into /tmp
    # (the root filesystem is read-only). It must never be cached: a stale demo
    # hint points at a credential that no longer exists.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints every asset under /assets, so they can be cached hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback: client-side routes must all return the shell.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
